name: Release images

# Every push to main publishes ghcr.io/<owner>/invoices-{api,web}:latest and :<sha> (linux/amd64).
# The repository variable NEXT_PUBLIC_API_URL is the public origin of the app (baked into the web bundle).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - name: Require NEXT_PUBLIC_API_URL
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: test -n "$API_URL" || { echo "::error::set the repository variable NEXT_PUBLIC_API_URL"; exit 1; }
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/invoices-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          # Baked into the web bundle (the browser calls the API on the same origin, /trpc and /files).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
