# infra-admin (services): the production deployment on the NUC belongs to the infra admin; do not change this file in
# this project. Requests go to the services project (inbox, docs/infra/rules.md in Tabula).
# Deployed verbatim to /srv/invoices/compose.yaml on the NUC (carnaby-server); secrets only in /srv/invoices/.env there
# (POSTGRES_PASSWORD, APP_SECRET, WEB_ORIGIN). Run `docker compose pull && docker compose up -d` in /srv/invoices.
# https://faktury.carnaby.sk: Caddy on the NUC (services repo, caddy/) sends /trpc and /files to invoices-api:3333 and
# everything else to invoices-web:3000 on the shared network "edge". No host ports. Nightly backup: services `backup`
# dumps invoices-db and backs up /srv/invoices (data/postgres is a bind mount owned by 1000:1000 = carnaby).
# api and web carry the Watchtower label (GHCR login on the NUC); Postgres is updated only by hand.
name: invoices

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: postgres:16-alpine
    container_name: invoices-db
    restart: unless-stopped
    user: '1000:1000'
    environment:
      POSTGRES_USER: invoices
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: invoices
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # Tabula global decision #cb98: 2m, the API waits on it. TCP check: during initdb the server listens on the socket only.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U invoices -d invoices']
      interval: 2m
      timeout: 3s
      retries: 30
      start_period: 2m
      start_interval: 2s
    logging: *logging

  api:
    image: ghcr.io/carnaby/invoices-api:${INVOICES_VERSION:-latest}
    container_name: invoices-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The container name, not "db": the API is also on the shared network "edge".
      DATABASE_URL: postgres://invoices:${POSTGRES_PASSWORD}@invoices-db:5432/invoices
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (at least 32 characters)}
      API_PORT: '3333'
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
    networks: [default, edge]
    # Chrome (puppeteer) renders the PDFs.
    mem_limit: 1g
    shm_size: 256m
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    # Tabula global decision #cb98: 30m, nothing waits on it.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3333/trpc/health.ping']
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 2m
      start_interval: 5s
    logging: *logging

  web:
    image: ghcr.io/carnaby/invoices-web:${INVOICES_VERSION:-latest}
    container_name: invoices-web
    restart: unless-stopped
    depends_on: [api]
    networks: [default, edge]
    mem_limit: 512m
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    # No wget or curl in this image: node's fetch.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 1m
      start_interval: 5s
    logging: *logging

networks:
  edge:
    external: true
